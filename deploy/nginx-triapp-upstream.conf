# Miroir versionné de /etc/nginx/conf.d/triapp-upstream.conf sur le VPS.
#
# Cible active de triapp.fr, réécrite à chaque déploiement par
# /usr/local/sbin/triapp-bascule : c'est ce fichier qui dit laquelle des deux
# couleurs (triage-app@3002 / triage-app@3003) sert le trafic. Le script de
# déploiement le lit pour savoir sur quel port construire la version suivante.
#
# Ne pas éditer à la main sur le serveur : la valeur y change à chaque
# déploiement, et celle du dépôt n'est que l'état d'amorçage.
upstream triapp_app {
    server 127.0.0.1:3003;
}
